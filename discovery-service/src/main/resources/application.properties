spring.application.name=discovery-service
server.port=4080

app.eureka.username=${EUREKA_USERNAME:favourite}
app.eureka.password=${EUREKA_PASSWORD:pa55word}

eureka.instance.hostname=localhost
eureka.client.registerWithEureka=false
eureka.client.fetchRegistry=false
eureka.client.service-url.defaultZone=http://${app.eureka.username}:${app.eureka.password}@localhost:${server.port}/eureka/
eureka.server.waitTimeInMsWhenSyncEmpty=0

# Actuator endpoints properties
management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always

# To monitor log file on admin server
logging.file.path=logs/
logging.file.name=logs/${spring.application.name}.log
logging.logback.rollingpolicy.max-history=5
logging.logback.rollingpolicy.max-file-size=10MB

logging.level.root=INFO
logging.level.org.springframework.cloud.gateway.route.RouteDefinitionRouteLocator=INFO
logging.level.org.springframework.cloud.gateway=TRACE