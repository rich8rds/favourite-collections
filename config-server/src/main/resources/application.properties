#======================================= App Configuration =======================================
spring.application.name=config-server
server.port=4088
spring.cloud.config.server.git.default-label=master
spring.cloud.config.server.git.uri=${HOME}/Desktop/Git/CDirect/favconfigrepo

#======================Eureka Configuration=======================================
eureka.client.serviceUrl.defaultZone=http://favourite:pa55word@localhost:4080/eureka

management.health.mail.enabled=false

#======================Logging Configuration=======================================
logging.file.path=logs/
logging.file.name=logs/${spring.application.name}.log
logging.logback.rollingpolicy.max-file-size=10MB

logging.level.root=INFO
logging.level.org.springframework.cloud.gateway.route.RouteDefinitionRouteLocator=INFO
logging.level.org.springframework.cloud.gateway=INFO

#======================Actuator Configuration=======================================
management.info.env.enabled=true
info.app.name=Config-Server Actuator
info.app.java.version=1.0
info.app.type=Config-Server MicroService
management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always
