#======================Application Configuration=======================================
spring.application.name=dashboard-service
server.port=4083
eureka.client.serviceUrl.defaultZone=http://favourite:pa55word@localhost:4080/eureka

#======================Logging Configuration=======================================
logging.file.path=logs/
logging.file.name=logs/${spring.application.name}.log
logging.logback.rollingpolicy.max-file-size=10MB

logging.level.root=INFO
logging.level.org.springframework.cloud.gateway.route.RouteDefinitionRouteLocator=INFO
logging.level.org.springframework.cloud.gateway=INFO

#======================Actuator Configuration=======================================
management.info.env.enabled=true
info.app.name=Dashboard Actuator
info.app.java.version=1.0
info.app.type=Dashboard MicroService
management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always